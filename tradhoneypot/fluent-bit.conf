[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name   tail
    Path   /logs/cowrie.json
    Tag    cowrie
    Parser json
    Refresh_Interval 5

[OUTPUT]
    Name            http
    Match           cowrie
    Host            139.59.112.240
    Port            8123
    URI             /?query=INSERT%20INTO%20logs.cowrie%20FORMAT%20JSONEachRow&input_format_skip_unknown_fields=1
    Header          X-ClickHouse-User default_user
    Header          X-ClickHouse-Key  default_password
    Format          json_stream
