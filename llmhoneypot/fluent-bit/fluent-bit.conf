[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name    forward
    Listen  0.0.0.0
    Port    24224
    Tag     beelzebub

[FILTER]
    Name         parser
    Match        beelzebub
    Key_Name     log
    Parser       json
    Reserve_Data On

[FILTER]
    Name          nest
    Match         beelzebub
    Operation     lift
    Nested_under  event

[OUTPUT]
    Name            http
    Match           beelzebub
    Host            ${CLICKHOUSE_HOST}
    Port            ${CLICKHOUSE_PORT}
    tls             On
    tls.verify      Off
    URI             /?query=INSERT%20INTO%20logs.beelzebub%20FORMAT%20JSONEachRow&input_format_skip_unknown_fields=1&date_time_input_format=best_effort
    Header          X-ClickHouse-User ${CLICKHOUSE_USER}
    Header          X-ClickHouse-Key  ${CLICKHOUSE_PASSWORD}
    Format          json_stream
